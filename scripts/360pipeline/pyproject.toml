[project]
name = "pipeline360"
version = "0.1.0"
description = "360 video to 3DGS pipeline using OpenSfM"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "opensfm",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "plyfile>=1.0.0",
    "scipy>=1.10.0",
]

[tool.uv.sources]
opensfm = { git = "https://github.com/mapillary/OpenSfM.git" }
